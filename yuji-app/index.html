  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="予己" />
  <meta name="theme-color" content="#f5e8d4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>予己 · 好好爱自己</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/tab2-forest.css?v=79" />
  <link rel="stylesheet" href="css/tab3-garden.css?v=79" />
  <link rel="stylesheet" href="css/tab4-stars.css?v=79" />

<body>
  <div class="app-container" id="app">

      <!-- 四个 Tab 面板 -->
      <main class="app-main">

        <!-- ============ Tab1 此刻·家 ============ -->
        <section id="tab1" class="tab-panel active" data-tab="tab1">
          <div class="tab1-room" id="roomStage" data-bg-time="morning">
            <!-- 远景层：房间底图（多层背景叠加，当前激活的显示） -->
            <div class="scene-layer layer-back">
              <div class="tab1-bg-stack" id="bgLayer"></div>
            </div>

            <!-- 远景层：尘埃光点 -->
            <div class="scene-layer layer-far">
              <div class="dust-motes" id="dustMotes"></div>
            </div>

            <!-- 幸福值柔光层 -->
            <div class="room-glow" id="roomGlow"></div>

            <!-- 总金币小标签 -->
            <div class="room-coin" id="coinDisplay">金币 0</div>

            <!-- 中层：家具组件（可编辑） -->
            <div class="scene-layer layer-mid room-furniture" id="roomFurniture"></div>

            <!-- 前景层：像素小我（6 帧 sprite sheet，抠除白底+锚点对齐）
                 两个 sprite 层（喝水/庆祝）叠在同一容器里，JS 按需切换哪个激活。 -->
            <div class="scene-layer layer-front">
              <div class="xiaowo" id="xiaowo" title="点击记录情绪">
                <div class="xiaowo-drinking" id="xiaowoDrinking"></div>
                <div class="xiaowo-celebrate" id="xiaowoCelebrate"></div>
                <div class="xiaowo-shadow"></div>
                <div class="xiaowo-click-hint">点我记录心情</div>
              </div>
            </div>

            <!-- 布置工具 -->
            <button class="room-edit-btn" id="roomEditBtn" title="布置房间">布置</button>
            <div class="room-edit-bar" id="roomEditBar" hidden>
              <span class="room-edit-hint">拖动家具 · 点击选中</span>
              <button class="room-edit-act primary" id="roomAddBtn">＋ 家具库</button>
            </div>

            <!-- 选中家具的尺寸 / 旋转控制条 -->
            <div class="room-item-bar" id="roomItemBar" hidden>
              <span class="rib-group">
                <span class="rib-label">缩放</span>
                <button class="rib-btn" id="roomScaleDown" title="缩小">－</button>
                <span class="rib-val" id="roomScaleVal">1.0×</span>
                <button class="rib-btn" id="roomScaleUp" title="放大">＋</button>
              </span>
              <span class="rib-sep"></span>
              <span class="rib-group">
                <span class="rib-label">转向</span>
                <button class="rib-btn" id="roomRotLeft" title="向左转面">⟲</button>
                <span class="rib-val" id="roomRotVal">0°</span>
                <button class="rib-btn" id="roomRotRight" title="向右转面">⟳</button>
              </span>
              <span class="rib-sep"></span>
              <span class="rib-group">
                <span class="rib-label">倾斜</span>
                <button class="rib-btn" id="roomTiltLeft" title="向左倾斜">⟲</button>
                <span class="rib-val" id="roomTiltVal">0°</span>
                <button class="rib-btn" id="roomTiltRight" title="向右倾斜">⟳</button>
              </span>
              <span class="rib-sep"></span>
              <button class="rib-btn rib-return" id="roomReturnBtn" title="放回家具库">↩ 放回</button>
            </div>
          </div>

          <!-- 自我照顾气泡（在房间下方，紧邻tab栏） -->
          <div class="tab1-care" id="carePanel">
            <div class="care-header">
              <span class="care-title">今天可以怎样照顾自己一点</span>
              <span class="care-meta">
                <span class="care-meta-item" title="幸福值">
                  <svg class="pix-icon pix-heart" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true">
                    <rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/>
                    <rect x="0" y="1" width="7" height="2"/>
                    <rect x="1" y="3" width="5" height="1"/>
                    <rect x="2" y="4" width="3" height="1"/>
                    <rect x="3" y="5" width="1" height="1"/>
                  </svg>
                  <b id="careValue">0</b>
                </span>
                <span class="care-meta-item" title="今日金币获取">
                  <svg class="pix-icon pix-coin" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true">
                    <rect x="2" y="0" width="3" height="1"/>
                    <rect x="1" y="1" width="5" height="1"/>
                    <rect x="0" y="2" width="7" height="3"/>
                    <rect x="1" y="5" width="5" height="1"/>
                    <rect x="2" y="6" width="3" height="1"/>
                    <rect x="3" y="2" width="1" height="3" fill="#ffe9b8"/>
                  </svg>
                  <b id="dailyCoin">0</b>/<i>20</i>
                </span>
              </span>
            </div>
            <div class="care-options" id="careOptions">
              <!-- JS 渲染：气泡网格 -->
            </div>
          </div>
        </section>

        <!-- ============ Tab2 遇见·内心森林 ============ -->
        <section id="tab2" class="tab-panel" data-tab="tab2">
          <div class="tab2-forest">
            <!-- 远景层：森林底图 -->
            <div class="scene-layer layer-back">
              <img class="tab2-bg" src="assets/tab-bg/tab2-1787835559183.jpg" alt="内心森林背景" />
            </div>

            <!-- 远层：光柱 + 飘雾 -->
            <div class="scene-layer layer-far">
              <div class="forest-beams"></div>
              <div class="forest-fog far-fog"></div>
            </div>

            <!-- 中层：本心对语入口木牌（位置/图标由后台 tab2_entry 控制，逻辑同 Tab1 家具） -->
            <!-- 心灵树洞入口木牌（同本心对语模式；用于写日记 + AI 引导写作） -->
            <div class="scene-layer layer-mid forest-objects">
              <button class="tab2-entry" id="dialogueEntry" title="本心对语">
                <img class="tab2-entry-img" src="" alt="本心对语" draggable="false" />
              </button>
              <button class="tab2-entry treehole-entry" id="treeholeEntry" title="心灵树洞">
                <img class="tab2-entry-img" src="" alt="心灵树洞" draggable="false" />
              </button>
            </div>

            <!-- 前景层：雾气 + 萤火 -->
            <div class="scene-layer layer-front">
              <div class="forest-fog near-fog"></div>
              <div class="forest-motes" id="forestMotes"></div>
            </div>
          </div>
        </section>

        <!-- ============ Tab3 生长·技能农场 ============ -->
        <section id="tab3" class="tab-panel" data-tab="tab3">
          <div class="tab3-garden">
            <!-- 远景层：tab3 背景（草地 / 天空等） -->
            <div class="scene-layer layer-back">
              <img class="tab3-bg" src="assets/farm/tab3-bg.png" alt="技能农场背景" />
            </div>

            <!-- 中-远景层：多块土地覆盖图层（每块=1 个种植按钮，由后台复制/摆放/设作物） -->
            <div class="scene-layer layer-mid" id="farmLandsLayer" style="position:absolute;inset:0;pointer-events:none;z-index:5;"></div>

            <!-- 农场日志按钮（右上角，已种技能 + 收获纪念） -->
            <button class="garden-journal-btn" id="gardenJournalBtn" title="农场日志 · 我的技能与收获纪念">
              <span class="gj-icon">📔</span>
              <span class="gj-label">农场日志</span>
            </button>

            <!-- 中层：引导提示（已移除 9 格子，整块土地为单一按钮） -->
            <div class="scene-layer layer-mid">
              <div class="garden-hint hidden" id="gardenHint">点击这块土地，种下一个想学的技能🌱</div>
            </div>

            <!-- 前景层：萤火 + 麦田光点 -->
            <div class="scene-layer layer-front">
              <div class="garden-butterflies" id="gardenButterflies"></div>
              <div class="garden-pollen" id="gardenPollen"></div>
            </div>
          </div>
        </section>

        <!-- ============ Tab4 星迹·个人宇宙（星座图） ============ -->
        <section id="tab4" class="tab-panel" data-tab="tab4">
          <div class="tab4-stars">
            <!-- 远景层：晨昏星空底图（保留） -->
            <div class="scene-layer layer-back">
              <img class="tab4-bg" src="assets/dc4b2caadae673cdc65c3779dd78fd70.png" alt="星迹背景" />
            </div>

            <!-- 中层：6 星座区（SVG 画连线 + DOM 星星 + 星座标签浮标） -->
            <div class="scene-layer layer-mid tab4-constellations" id="constellationsLayer">
              <svg class="constellation-lines" id="consSvg"
                   viewBox="0 0 100 100" preserveAspectRatio="none"
                   aria-hidden="true"></svg>
              <div class="stars-layer" id="starsLayer"></div>
              <div class="constellation-labels" id="consLabels"></div>
            </div>

            <!-- 前景层：云絮 + 流星氛围（保留） -->
            <div class="scene-layer layer-front">
              <div class="stars-clouds"></div>
              <div class="shooting-star"></div>
            </div>
          </div>
        </section>

      </main>

      <!-- 底部 Tab 导航 -->
      <nav class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-target="tab1">
          <span class="tab-ico">🏠</span>
          <span class="tab-lbl">此刻</span>
        </button>
        <button class="tab-btn" data-target="tab2">
          <span class="tab-ico">🌲</span>
          <span class="tab-lbl">遇见</span>
        </button>
        <button class="tab-btn" data-target="tab3">
          <span class="tab-ico">🌻</span>
          <span class="tab-lbl">生长</span>
        </button>
        <button class="tab-btn" data-target="tab4">
          <span class="tab-ico">🌌</span>
          <span class="tab-lbl">星迹</span>
        </button>
      </nav>

      <!-- 弹窗容器 -->
      <div class="popup-root" id="popupRoot"></div>

      <!-- 提示 toast -->
      <div class="toast" id="toast"></div>
  </div>

  <!-- ============================================================
       家具/SVG 精灵 alpha 硬边二值化 filter
       解决抠图留下半透明像素导致"家具透背景"的问题：
         A=0         → 0   (完全透明，保留形状外镂空)
         A ∈ [1,255] → 255 (完全实心，不允许任何半透像素漏网)
       所有 tab 的家具 / 精灵 / 入口木牌 img 统一引用此 filter
       ============================================================ -->
  <svg width="0" height="0" style="position:absolute;left:-9999px;pointer-events:none" aria-hidden="true">
    <defs>
      <filter id="alpha-hard-edge" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <!-- feFuncA: threshold 分段函数。tableValues 两个值 → 把 [0,0.5)→0, [0.5,1]→1
             等价于 A<128→0, A>=128→255。家具像素只要不是纯透明就强制实心 -->
        <feComponentTransfer>
          <feFuncA type="discrete" tableValues="0 1"/>
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>
